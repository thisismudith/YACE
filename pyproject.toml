[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yace-codec"
dynamic = ["version"]
description = "YACE (Yet Another Custom Encoder): reversible text encoding with random substitution tables, plus authenticated encryption with your own secret token, with no dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mudith Daga" }]
keywords = [
    "yace",
    "encoder",
    "decoder",
    "encoding",
    "codec",
    "substitution",
    "obfuscation",
    "encryption",
    "decryption",
    "text",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/thisismudith/YACE"
Source = "https://github.com/thisismudith/YACE"
Issues = "https://github.com/thisismudith/YACE/issues"
Changelog = "https://github.com/thisismudith/YACE/blob/main/CHANGELOG.md"

[project.scripts]
yace-codec = "yace_codec.cli:main"

[tool.setuptools.dynamic]
version = { attr = "yace_codec.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yace_codec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
