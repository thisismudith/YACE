# Runs the test suite on pushes to main, tags, and pull requests; the release
# workflow also calls it before publishing. Every action is pinned to a full
# commit SHA (the comment names its release tag).

name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest -q

  minimum-dependencies:
    name: Oldest supported dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install . "cryptography==42.0.0" "keyring==24.0.0" "pytest==8.0.0" "hypothesis==6.100.0"
      - name: Test
        run: python -m pytest -q

  distributions:
    name: Built wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build with the release tools
        run: |
          python -m pip install --require-hashes --no-deps -r .github/build-requirements.txt
          python -m build --no-isolation
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Test the wheel with the tests from the sdist
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install "$(ls dist/*.whl)[test,keyring]"
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/yace_codec-*/ && /tmp/venv/bin/python -m pytest -q

  types:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[keyring]" "mypy==2.4.0"
      - name: Type check
        run: |
          python -m mypy --strict src/yace_codec
          python -m mypy --strict --platform win32 src/yace_codec
